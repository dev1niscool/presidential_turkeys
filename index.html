<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ed">
  <meta name="description" content="A year-by-year atlas of America’s pardoned turkeys.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Turkeys">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Presidential Turkeys">
  <meta property="og:title" content="Presidential Turkeys">
  <meta property="og:description" content="A year-by-year atlas of America’s pardoned turkeys.">
  <meta property="og:url" content="https://dev1niscool.github.io/presidential_turkeys/">
  <meta property="og:image" content="https://dev1niscool.github.io/presidential_turkeys/assets/social-card-v1.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Presidential Turkeys, 1989–2026, beside four archival turkey portraits and an ivory turkey emblem.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Presidential Turkeys">
  <meta name="twitter:description" content="A year-by-year atlas of America’s pardoned turkeys.">
  <meta name="twitter:image" content="https://dev1niscool.github.io/presidential_turkeys/assets/social-card-v1.jpg">
  <meta name="twitter:image:alt" content="Presidential Turkeys, 1989–2026, beside four archival turkey portraits and an ivory turkey emblem.">
  <title>Presidential Turkeys</title>
  <link rel="canonical" href="https://dev1niscool.github.io/presidential_turkeys/">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#collection">Skip to turkeys</a>
  <header class="site-header wrap">
    <h1><a href="./">Presidential Turkeys</a></h1>
    <div class="header-meta"><span id="year-span">1989–2026</span><a href="https://github.com/dev1niscool/presidential_turkeys" target="_blank" rel="noopener noreferrer">GitHub</a></div>
  </header>
  <main class="select-screen wrap" id="collection">
    <section class="selection" aria-label="Selected turkey">
      <a id="selection-photo" class="selection-photo" href="#year-2024" aria-label="View Peach and Blossom"><img src="assets/photos/hero-alternate.jpg" alt="Peach and Blossom at the White House" fetchpriority="high"></a>
      <div class="selection-caption"><span id="selection-year">2024</span><span class="selection-status" aria-hidden="true">Selected</span></div>
      <h2 id="selection-name">Peach &amp; Blossom</h2>
      <p id="selection-president">Joe Biden</p>
      <a id="selection-open" class="details-link" href="#year-2024">View profile</a>
    </section>
    <section class="roster" aria-label="Choose a turkey">
      <div class="roster-tools">
        <div class="decades" role="group" aria-label="Filter by decade"><button type="button" class="active" data-decade="all" aria-pressed="true">All</button><button type="button" data-decade="2020" aria-pressed="false">2020s</button><button type="button" data-decade="2010" aria-pressed="false">2010s</button><button type="button" data-decade="2000" aria-pressed="false">2000s</button><button type="button" data-decade="1990" aria-pressed="false">1990s</button><button type="button" data-decade="1980" aria-pressed="false">1980s</button></div>
        <form id="filters" role="search" aria-label="Search turkeys"><label class="search-field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="sr-only">Search by name, year, president or state</span><input id="search" type="search" placeholder="Search" autocomplete="off"></label></form>
      </div>
      <p id="result-count" class="sr-only" role="status" aria-live="polite">Loading turkeys</p>
      <div id="archive" class="card-grid"></div>
      <div id="empty" class="empty-state" hidden><p>No matches.</p><button id="reset" type="button">Reset filters</button></div>
      <p id="load-error" hidden>Unable to load. Please refresh.</p>
      <noscript><a href="data/turkeys.json">Read the archive</a></noscript>
    </section>
  </main>
  <dialog id="profile" aria-labelledby="profile-title"><button class="dialog-close" type="button" aria-label="Close profile">×</button><div id="profile-content"></div></dialog>
</body>
</html>
